<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр темы | Mordor Role Play</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #141414; color: #e2e2e2; }
        header { background-color: #1d1d1d; border-bottom: 3px solid #c82323; padding: 12px 15px; }
        .logo-m::before { content: 'M'; background-color: #c82323; padding: 2px 12px; border-radius: 4px; font-weight: bold; color: #fff; }
        .container { max-width: 900px; width: 100%; margin: 15px auto; padding: 0 10px; }
        .nav-link { display: inline-block; background-color: #1d1d1d; border: 1px solid #2d2d2d; color: #aaaaaa; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 15px; }
        .admin-controls { background-color: #1d1515; border: 1px solid #c82323; padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; display: flex; gap: 10px; }
        .admin-btn { background-color: #c82323; border: 1px solid #9c1a1a; color: white; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .admin-btn.secondary { background-color: #4b4b4b; border-color: #333; }
        .post-container { background-color: #1d1d1d; border: 1px solid #2d2d2d; border-radius: 4px; display: flex; margin-bottom: 15px; overflow: hidden; }
        .post-sidebar { width: 160px; background-color: #181818; border-right: 1px solid #2d2d2d; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .avatar-fake { width: 50px; height: 50px; background-color: #2a2a2a; border-radius: 4px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .post-author-name { font-size: 14px; color: #ffffff; font-weight: bold; }
        .author-status { font-size: 10px; padding: 2px 6px; border-radius: 2px; font-weight: bold; text-transform: uppercase; margin-top: 5px; color:#fff; background-color: #383838; }
        .author-status.moder { background-color: #c82323; }
        .post-main { flex: 1; padding: 20px; }
        .post-date { font-size: 11px; color: #666; border-bottom: 1px solid #262626; padding-bottom: 6px; margin-bottom: 10px; }
        .post-content { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .reply-box { background-color: #1d1d1d; border: 1px solid #2d2d2d; border-radius: 4px; margin-top: 25px; padding: 15px; }
        textarea { width: 100%; height: 120px; background-color: #262626; border: 1px solid #3d3d3d; border-radius: 4px; padding: 10px; color: #fff; outline: none; resize: vertical; }
        .closed-notice { background-color: #1a1515; border: 1px dashed #c82323; color: #ff4c4c; padding: 15px; border-radius: 4px; text-align: center; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

    <header><div class="logo-m"></div></header>

    <div class="container">
        <a href="forum.html" class="nav-link">← Назад ко всем темам</a>

        <div id="moderator-tools" class="admin-controls" style="display: none;">
            <button id="toggle-close-btn" class="admin-btn" onclick="toggleThreadStatus()">Закрыть тему</button>
            <button class="admin-btn secondary" onclick="deleteThread()">Удалить тему</button>
        </div>

        <h1 id="main-thread-title" style="font-size:22px; margin-bottom:15px; font-weight:normal;">Загрузка...</h1>
        <div id="posts-flow-container"></div>

        <div id="reply-form-wrapper" class="reply-box">
            <textarea id="reply-text-field" placeholder="Напишите ваше сообщение..."></textarea>
            <div style="display:flex; justify-content:flex-end; margin-top:10px;">
                <button class="admin-btn" onclick="sendComment()">Отправить ответ</button>
            </div>
        </div>

        <div id="thread-closed-msg" class="closed-notice" style="display: none;"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://efnqviavjpkcvhxbvbkq.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_P0y1T9rS5WUGBW8ezCaCyA_7Xc87imK';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const session = JSON.parse(localStorage.getItem('forum_session'));
        if (!session) { window.location.href = 'index.html'; }

        const urlParams = new URLSearchParams(window.location.search);
        // ИСПРАВЛЕНО: ID темы считывается как строка (UUID), а не число
        const threadId = urlParams.get('id'); 
        let currentThreadData = null;

        if (session.status === 'moder') { document.getElementById('moderator-tools').style.display = 'flex'; }

        async function loadThreadData() {
            if (!threadId) { window.location.href = 'forum.html'; return; }

            const { data: thread } = await _supabase.from('threads').select(`*, profiles!threads_author_id_fkey(*)`).eq('id', threadId).maybeSingle();
            if (!thread) { window.location.href = 'forum.html'; return; }

            currentThreadData = thread;
            document.getElementById('main-thread-title').innerText = thread.title;
            
            const closeBtn = document.getElementById('toggle-close-btn');
            const replyWrapper = document.getElementById('reply-form-wrapper');
            const closedMsg = document.getElementById('thread-closed-msg');

            if (thread.is_closed) {
                closeBtn.innerText = 'Открыть тему';
                replyWrapper.style.display = 'none';
                closedMsg.innerText = '🔒 Эта тема закрыта для обсуждения модерацией форума.';
                closedMsg.style.display = 'block';
            } else if (session.is_banned) {
                // ПРОВЕРКА НА БАН: забаненный не видит форму и получает уведомление
                replyWrapper.style.display = 'none';
                closedMsg.innerText = '❌ Вы заблокированы модерацией и не можете оставлять ответы.';
                closedMsg.style.display = 'block';
            } else {
                closeBtn.innerText = 'Закрыть тему';
                replyWrapper.style.display = 'block';
                closedMsg.style.display = 'none';
            }

            const flow = document.getElementById('posts-flow-container');
            flow.innerHTML = '';
            flow.appendChild(createPostRow(thread.profiles?.nickname || 'Система', thread.profiles?.status || 'user', new Date(thread.created_at).toLocaleString('ru-RU'), thread.content));

            const { data: comments } = await _supabase.from('comments').select(`*, profiles(*)`).eq('thread_id', threadId).order('created_at', { ascending: true });
            comments?.forEach(c => {
                flow.appendChild(createPostRow(c.profiles?.nickname || 'Пользователь', c.profiles?.status || 'user', new Date(c.created_at).toLocaleString('ru-RU'), c.content));
            });
        }

        function createPostRow(username, status, dateStr, text) {
            const row = document.createElement('div');
            row.className = 'post-container';
            row.innerHTML = `
                <div class="post-sidebar">
                    <div class="avatar-fake">👤</div>
                    <div class="post-author-name">${username}</div>
                    <span class="author-status ${status}">${status === 'moder' ? 'Модератор' : 'Игрок'}</span>
                </div>
                <div class="post-main">
                    <div class="post-date">${dateStr}</div>
                    <div class="post-content">${text}</div>
                </div>`;
            return row;
        }

        async function sendComment() {
            // ЖЕСТКАЯ БЛОКИРОВКА ВЗАИМОДЕЙСТВИЯ ДЛЯ ЗАБАНЕННЫХ
            if (session.is_banned) { 
                alert('Вы забанены и не можете оставлять ответы!'); 
                return; 
            }
            const field = document.getElementById('reply-text-field');
            const commentText = field.value.trim();
            if (!commentText) return;

            await _supabase.from('comments').insert([{ content: commentText, thread_id: threadId, author_id: session.id }]);
            field.value = '';
            loadThreadData();
        }

        async function toggleThreadStatus() {
            await _supabase.from('threads').update({ is_closed: !currentThreadData.is_closed }).eq('id', threadId);
            loadThreadData();
        }

        async function deleteThread() {
            if (!confirm('Удалить тему?')) return;
            await _supabase.from('threads').delete().eq('id', threadId);
            window.location.href = 'forum.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadThreadData();
            _supabase.channel('room1').on('postgres_changes', { event: 'INSERT', filter: `table=eq.comments&thread_id=eq.${threadId}` }, () => loadThreadData()).subscribe();
        });
    </script>
</body>
</html>
